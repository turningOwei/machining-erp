user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off; # 隐藏版本号，更安全

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##
    # 建议只保留 TLSv1.2 和 TLSv1.3，TLSv1 和 1.1 已不安全
    ssl_protocols TLSv1.2 TLSv1.3; 
    ssl_prefer_server_ciphers on;

    ##
    # Logging Settings
    ##
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml;

    ##
    # Virtual Host Configs
    ##
    # 注意：如果下面定义了 server 块，建议注释掉 include sites-enabled/* 避免冲突
    # include /etc/nginx/conf.d/*.conf;
    # include /etc/nginx/sites-enabled/*;

    # ==========================================
    # HTTP → HTTPS 重定向
    # ==========================================
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ==========================================
    # HTTPS 主配置
    # ==========================================
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL 证书路径 (请替换为实际证书路径)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # 前端静态文件根目录
        root /etc/nginx/html;
        index index.html;

        # SPA 路由支持
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 代理到 Go 后端 (HTTPS)
        location /api {
            proxy_pass https://127.0.0.1:28080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 后端自签证书时可启用 (生产环境建议使用受信任证书)
            # proxy_ssl_verify off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        access_log /var/log/nginx/erp_access.log;
        error_log /var/log/nginx/erp_error.log;
    }
}